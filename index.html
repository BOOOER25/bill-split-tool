button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit;border:0;background:none}
button:disabled{cursor:default;opacity:.42}
button,input,select,textarea{outline-offset:4px}
button:focus-visible,a:focus-visible{outline:2px solid #e88f47}
input,select,textarea{min-width:0;padding:11px 12px;color:var(--ink);background:#fffefb;border:1.5px solid #e9cca5;border-radius:11px}
input:focus,select:focus,textarea:focus{outline:2px solid #ffd766}
h1,h2,h3,p{margin:0}
svg{width:20px;height:20px;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button svg{pointer-events:none}
a{color:inherit}
.shell{max-width:1110px;margin:auto;padding:0 30px 38px}
.topbar{height:84px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650;letter-spacing:.5px}
.brand-mark{width:49px;height:39px;display:grid;place-items:center;border-radius:11px;background:#ffdf65;box-shadow:2px 2px 0 #f0ba71;overflow:hidden}
.brand-mark img{width:49px;height:39px;object-fit:contain;display:block}
.top-actions{display:flex;gap:10px;align-items:center}
#reset-demo{color:#8b7e70;font-size:11px;padding:8px}
#new-group{background:#ffdf68;border:1.5px solid #ae713e;box-shadow:0 3px 0 #f1b667}
.page-head{padding:21px 1px 25px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.page-head h1{font-size:25px;font-weight:650;letter-spacing:.4px;position:relative;isolation:isolate}
.page-head h1:after{content:"";position:absolute;bottom:1px;left:0;width:58%;height:8px;background:#ffe89b;border-radius:5px;z-index:-1;transform:rotate(-1deg)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border-radius:11px;font-weight:500;white-space:nowrap;transition:background .18s,transform .18s,box-shadow .18s}
.button:hover{background:#fff0bd}
.button:active{transform:translateY(2px);box-shadow:none!important}
.primary{color:#533a25;background:#ffda5d;border:1.5px solid #c6883f;box-shadow:0 3px 0 #edb45c}
.primary:hover{background:#ffe17d}
.outline{background:#fffef9;border:1.5px solid #dfb382}
.soft{background:var(--soft);color:#b8722f}
.small{padding:8px 12px;font-size:12px;border-radius:10px}
.icon-btn{height:36px;width:36px;display:inline-grid;place-items:center;border-radius:10px}
.icon-btn:hover{background:var(--soft)}
.workspace{display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px;align-items:start}
.sidebar{background:#fffdf7;border:1.5px solid #e7c28b;border-radius:16px 18px 15px 19px;padding:9px;box-shadow:3px 3px 0 #fff0bf}
.side-total{display:flex;width:100%;align-items:center;gap:10px;padding:12px;border-radius:10px;text-align:left}
.side-total.active{background:#fff0b7}
.side-total .icon-box{height:32px;width:32px;display:grid;place-items:center;color:#b17d35}
.side-total b{font-weight:550;font-size:13px}
.side-divider{border:0;border-top:1px dashed #e8d6ba;margin:7px 12px}
.person{display:flex;align-items:center;width:100%;gap:10px;text-align:left;padding:13px 12px;border-radius:11px;margin:4px 0}
.person:hover,.side-total:hover{background:#fff5d9}
.person.active{background:#ffedf2;box-shadow:inset 0 0 0 1px #f6d3dc}
.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#fff2c4;color:#b68138;font-weight:500;font-size:12px;flex-shrink:0}
.person:nth-of-type(2n) .avatar{background:#ffe7ed;color:#cd7c91}
.person.active .avatar{background:#ffd5df;color:#b8627a;border:1px solid #f0b4c2}
.person-meta{flex:1}.person-meta b{font-size:13px;font-weight:500}
.person-amount{font-size:18px;font-weight:600;color:#de8734;font-variant-numeric:tabular-nums}
.person-amount small{display:block;font-size:10px;font-weight:400;color:var(--muted);text-align:right}

.summary-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.summary-top h2{font-size:14px;font-weight:500;color:#65503d}
.summary-top span{font-size:10px;color:#b27b40;background:#fff8e0;border:1px solid #f6dfaa;border-radius:8px;padding:4px 8px;white-space:nowrap}
.hero-money{font-size:56px;letter-spacing:-1.5px;font-weight:600;line-height:1.3;margin:8px 0 0;color:#f69a37;font-variant-numeric:tabular-nums}
.hero-money small{font-size:27px;letter-spacing:0;font-weight:500;margin-right:4px}
.summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.summary-stats>div{padding:11px 14px;background:#fff8e0;border-radius:12px}
.summary-stats>div:nth-child(2){background:#feedf2}
.summary-stats span{display:block;font-size:11px;color:#9c8a76;margin-bottom:3px}
.summary-stats b{font-size:17px;color:#d88a35;font-weight:500;font-variant-numeric:tabular-nums}
.summary-stats>div:nth-child(2) b{color:#ed7e97}
.content-card{margin-top:25px;background:transparent}
.card-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 3px 15px}
.tabs{display:flex;gap:22px;align-items:center}
.tabs button{padding:4px 0;position:relative;font-size:13px;color:#9a8e82;isolation:isolate}
.tabs button.active{font-size:16px;font-weight:600;color:#3a3028}
.tabs button.active:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:6px;border-radius:4px;background:#ffe18a;transform:rotate(-1.5deg);z-index:-1}
.count{font-size:11px;color:#a29282}
.bill-row{display:flex;align-items:center;gap:13px;padding:17px 21px;margin-bottom:11px;background:#fff;border:1.5px solid #7b634b;border-radius:12px 14px 11px 14px;position:relative;box-shadow:2px 2px 0 #f9e7b8;isolation:isolate}
.bill-row:before{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;background:linear-gradient(to left,#fff1c6 0 98px,#fff 98px)}
.bill-row:after{content:"";position:absolute;top:7px;bottom:7px;right:97px;border-left:1.5px dashed #dac29c;pointer-events:none}
.bill-row:focus-within{z-index:1}
.check{appearance:none;width:22px;height:22px;min-width:22px;margin:0;border:1.5px solid #bba88e;border-radius:6px;padding:0;background:#fff;cursor:pointer;display:grid;place-items:center;position:relative}
.check:checked{background:#e6ad68;border-color:#c99152}
.check:checked:after{content:"";width:9px;height:5px;border-bottom:2px solid white;border-left:2px solid white;transform:translateY(-1px) rotate(-45deg)}
.category{display:none}
.bill-info{flex:1;min-width:0}
.bill-info b{font-size:14px;font-weight:500;display:block;overflow-wrap:anywhere}
.bill-info small{display:block;color:#a19282;font-size:11px;margin-top:4px}
.bill-money{min-width:84px;text-align:right;padding-left:11px}
.bill-money b{font-size:17px;font-weight:550;color:#c98130;font-variant-numeric:tabular-nums}
.add-person-bill{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin:14px 0;padding:12px;background:#fffdf7;border:1px dashed #d9b879;border-radius:10px;font-size:12px;color:#b17e3c}
.add-person-bill svg{width:17px;height:17px}
.add-person-bill:hover{background:#fff7df}
.action-footer{margin-top:17px}
.footer-actions{display:flex;gap:12px}
.footer-actions>.button{flex:1}
.complete-empty{display:flex;align-items:center;justify-content:center;gap:8px;background:#fffdf5;border:1px dashed #e4cca2;border-radius:13px;padding:27px 12px;color:#b88b52;font-size:13px}
.overview-members{display:flex;flex-direction:column;gap:11px}
.overview-member{display:flex;align-items:center;gap:12px;width:100%;padding:17px 20px;text-align:left;background:#fff;border:1.5px solid #e5c795;border-radius:12px 14px 12px 13px;box-shadow:2px 2px #fff0c6}
.overview-member .grow{flex:1;font-size:14px;font-weight:500}
.overview-member .grow small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px}
.overview-balance{text-align:right}.overview-balance strong{display:block;font-size:24px;font-weight:600;color:#ed8198;font-variant-numeric:tabular-nums}
.overview-balance small{display:block;color:#ac9384;font-size:10px}
.overview-member>svg{width:14px;height:14px;color:#bc9e78}
.overview-member.self-member .overview-balance strong{font-size:16px;font-weight:400;color:var(--muted)}
.overview-member.member-settled strong{font-weight:400;color:var(--muted)}
.settled-card{margin-top:22px;background:#fffcf3;border:1px solid #eadfc9;border-radius:13px;overflow:hidden}
.settled-card summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-size:12px;color:#a3937e;cursor:pointer}
.settled-card summary::-webkit-details-marker{display:none}
.settled-card summary em{font-style:normal;margin-left:6px;color:#b6a791}
.settled-card summary svg{width:14px;height:14px;transform:rotate(90deg);transition:transform .2s}
.settled-card:not([open]) summary svg{transform:rotate(0)}
.settled-list{border-top:1px dashed #e7dcc7}
.is-settled{margin:0;padding:16px 18px;background:transparent;border:0;border-bottom:1px solid #f1e9d9;border-radius:0;box-shadow:none;color:#a79b87}
.is-settled:last-child{border-bottom:0}
.is-settled:before,.is-settled:after{display:none}
.is-settled .bill-info b,.is-settled .bill-money b{font-weight:400;color:#b2a48f;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:#c4b7a3}
.is-settled .bill-info small{color:#b9ad99}
.is-settled .check:checked{background:#cfbea2;border-color:#c4b391}
.log{display:flex;align-items:flex-start;gap:12px;padding:17px 18px;margin-bottom:10px;background:#fff;border:1px solid #ead9bc;border-radius:12px}
.log-symbol{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#fff1c6;color:#c99343;flex-shrink:0}
.log-symbol svg{width:16px;height:16px}
.log p{flex:1;min-width:0}
.log p b{font-size:13px;font-weight:500}
.log small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.log-amount{font-size:16px;color:#e39643;font-variant-numeric:tabular-nums;text-align:right}
.log-amount button{display:block;font-size:10px;color:#ac9c88;padding:5px 0 0;margin-left:auto}
.empty{padding:32px 12px;text-align:center;font-size:12px;color:#a39482}
.backdrop{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:#4c352b45;backdrop-filter:blur(5px)}
.backdrop[hidden]{display:none}
.modal{width:500px;max-width:100%;max-height:90dvh;overflow:auto;background:#fffefa;border:2px solid #e7ba7c;border-radius:21px 24px 21px 23px;padding:26px;box-shadow:0 5px #ffdf83,0 17px 70px #72512a28}
.modal.wide{width:670px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.modal-head h2{font-size:19px;font-weight:600}
.modal-sub{font-size:12px;color:var(--muted);margin-top:-10px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}
.field>span{font-size:12px;color:#9b846c}
.amount-field{display:flex;align-items:center;gap:5px;margin:12px 0 13px;border-bottom:2px solid #e9b666}
.amount-field span{font-size:27px;color:#c98c37}
.amount-field input{width:100%;border:0;outline:none!important;font-size:38px;background:none;padding:10px 12px;border-radius:0;color:#d78e36;font-variant-numeric:tabular-nums}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.modal-foot .primary{flex:1}
.error{font-size:12px;color:#b65e53;background:#fff0e8;border-radius:9px;padding:10px 12px;margin-top:12px}
.error:empty{display:none}
.pill-tabs{display:flex;gap:4px;padding:4px;background:#fff4d6;border-radius:11px}
.pill-tabs button{flex:1;padding:9px 10px;border-radius:8px;color:#ad9576}
.pill-tabs button.active{color:#b87830;background:#fff;box-shadow:0 2px 0 #edd29c}
.bill-select{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px dashed #ead9ba;cursor:pointer}
.bill-select .grow{flex:1;min-width:0}
.bill-select small{display:block;font-size:11px;color:var(--muted)}
.bill-select b{font-weight:500}
.selected-total{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0}
.selected-total b{font-size:22px;color:#d78e36;font-variant-numeric:tabular-nums}
.step-indicator{display:flex;align-items:center;gap:9px;font-size:11px;color:#b3a68f;margin-bottom:22px}
.step-indicator .on{color:#c38b3e}.step-indicator i{height:1px;width:23px;background:#e8d4b2}
.allocation-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:18px 0 7px}
.allocation{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed #eadcc5;font-size:12px}
.allocation>div{flex:1}
.member-input{display:flex;align-items:center;gap:9px;margin:10px 0}
.member-input input:first-child{flex:1;width:100px}
.member-input input.weight{width:70px}
.member-input span{font-size:12px;color:var(--muted);white-space:nowrap}
.draft-total{font-size:31px;font-weight:550;margin-bottom:15px;color:#dc913a}
.draft-total small{font-size:12px;font-weight:400;color:var(--muted);margin-left:7px}
.export-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:17px}
.export-toolbar select{flex:1}
.export-toolbar .pill-tabs{min-width:150px}
.export-preview{background:#faf2de;border-radius:12px;padding:22px;max-height:45dvh;overflow:auto;text-align:center}
.export-preview canvas{width:100%;max-width:375px;height:auto;box-shadow:0 5px 20px #ad8a5420}
.export-preview textarea{width:100%;height:340px;resize:vertical;text-align:left;font-size:13px;line-height:1.9}
.toast{position:fixed;z-index:50;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:15px;max-width:calc(100% - 28px);padding:12px 18px;background:#67503b;color:#fff9ed;border-radius:11px;font-size:12px;box-shadow:0 4px 20px #8b684529}
.toast[hidden]{display:none}.toast button{color:#ffdc7a;text-decoration:underline;padding:3px;white-space:nowrap}
.mini-note{font-size:11px;color:var(--muted);margin-top:13px}
@media(max-width:800px){.shell{padding:0 21px 30px}.workspace{grid-template-columns:205px minmax(0,1fr);gap:20px}.bill-row{padding:17px 16px;gap:10px}.summary{padding:22px}.hero-money{font-size:49px}.bill-info b{font-size:13px}}

ons{gap:11px}.footer-actions .button{font-size:13px;padding:11px 12px}.add-person-bill{margin:13px 0;padding:11px}.settled-card{margin-top:20px}.settled-card summary{padding:13px 16px}.is-settled{padding:15px 16px;margin:0}.overview-member{padding:16px 17px;gap:10px}.overview-member .avatar{width:32px;height:32px}.overview-member .grow{font-size:13px}.overview-balance strong{font-size:23px}.backdrop{align-items:flex-end;padding:12px}.modal{padding:22px;max-height:94dvh}.modal-head h2{font-size:18px}.modal-foot{margin-top:20px}.export-toolbar{gap:8px}.export-toolbar select{width:100px}.export-toolbar .pill-tabs{min-width:120px}.export-preview{padding:12px}.member-input{gap:7px}.member-input input.weight{width:57px}.toast{bottom:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.summary-stats.total-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.summary-stats.total-stats>div{padding:11px 12px}
.summary-stats.total-stats b{font-size:16px;white-space:nowrap}
.ledger-summary-info{display:flex;flex-wrap:wrap;gap:7px 18px;margin-top:15px;padding-top:12px;border-top:1px dashed #efd9af;font-size:11px;color:#a28d72}
.ledger-summary-info b{color:#b47e36;font-weight:500;margin-left:5px}
.ledger-section{margin-top:26px}
.ledger-section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.ledger-section-title h2,.total-members-title{font-size:16px;font-weight:600}
.ledger-section-title>span{color:#a69072;font-size:11px}
.ledger-consumptions{display:flex;flex-direction:column;gap:11px}
.ledger-consumption{padding:17px 19px;background:#fff;border:1px solid #ead6b0;border-radius:13px;box-shadow:1px 2px #fff4d8}
.ledger-consumption-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}
.ledger-consumption-head>div{min-width:0}
.ledger-consumption-head b{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.ledger-consumption-head small{display:block;font-size:10px;color:#a4947c;margin-top:4px}
.ledger-consumption-head strong{font-size:17px;font-weight:550;color:#d98d36;white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger-shares{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding-top:11px;border-top:1px dashed #eee1ca}
.share-chip{padding:4px 8px;background:#fff8e5;border-radius:6px;color:#a28c69;font-size:10px;max-width:100%;overflow-wrap:anywhere}
.share-chip b{font-weight:500;color:#c08c42;margin-left:4px}
.share-chip.independent{background:#fff0f3;color:#b77f8d}
.share-chip.independent b{color:#df879e}
.overview-member.total-member{flex-wrap:wrap;row-gap:12px}
.total-member .grow{min-width:80px}
.total-member .grow small{font-size:10px}
.member-breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:calc(100% - 44px);gap:8px;margin-left:44px;padding-top:10px;border-top:1px dashed #efdfc0}
.member-breakdown span{font-size:10px;color:#a99274}
.member-breakdown b{display:block;margin-top:2px;font-size:13px;font-weight:500;color:#bb8a4b;font-variant-numeric:tabular-nums}
.member-breakdown span:last-child b{color:#de8da1}
.export-preview{max-height:57dvh;padding:19px;background:#f3ead7}
.export-preview canvas{max-width:440px;box-shadow:0 8px 25px #a5834824}
@media(max-width:600px){.summary-stats.total-stats{gap:7px}.summary-stats.total-stats>div{padding:9px 10px}.summary-stats.total-stats b{font-size:14px}.summary-stats.total-stats span{font-size:9px}.ledger-summary-info{gap:6px 15px;font-size:10px;margin-top:13px;padding-top:10px}.ledger-section{margin-top:23px}.ledger-section-title h2,.total-members-title{font-size:15px}.ledger-section-title>span{font-size:10px}.ledger-consumption{padding:15px 16px}.ledger-consumption-head strong{font-size:16px}.member-breakdown{width:calc(100% - 42px);margin-left:42px}.member-breakdown b{font-size:12px}.export-preview{padding:10px}}

.bill-row:not(.is-settled){border-radius:11px 15px 11px 14px}
.ledger-consumption,.overview-member{border-radius:12px 15px 12px 14px}
.is-settled{border-image:none}

.percent-toolbar{display:flex;align-items:center;justify-content:space-between;margin:15px 0 9px;gap:10px;font-size:12px;color:#a18b6f}
.percent-input{display:flex;align-items:center;width:100px;border:1.5px solid #e9cca5;border-radius:10px;background:#fffefb;padding-right:10px}
.percent-input input{border:0;width:100%;padding:10px 7px;text-align:right;background:none;outline-offset:0}
.percent-input span{font-size:13px;color:#b18549}
.percent-total{padding:10px 12px;border-radius:9px;background:#fff0e8;color:#b76b51;font-size:12px;margin-top:13px}
.percent-total.valid{background:#fff5d7;color:#a67b38}.confirmed-percent{display:block;color:#b29163;font-size:11px;margin-top:3px}
@media(max-width:600px){.percent-input{width:88px;min-width:88px}.percent-toolbar{font-size:11px}.percent-toolbar .button{font-size:11px}}
.member-input .percent-input input{width:100%;min-width:0;flex:initial}
.receipt-export{width:530px!important;background:transparent;border:0;border-radius:0;box-shadow:none;padding:0;max-height:94dvh;overflow:visible}
.receipt-export .modal-head{color:#fff9ee;margin:0 0 11px}
.receipt-export .modal-head h2{font-size:17px}
.receipt-export .export-toolbar{background:#fff8e4;padding:6px;border-radius:11px;margin-bottom:12px}
.receipt-export .export-toolbar select{background:#fff;border:0;font-size:12px}
.receipt-export .export-preview{background:transparent;border-radius:0;padding:3px 8px;max-height:calc(94dvh - 255px);overflow:auto;min-height:100px;scrollbar-width:thin}
.receipt-export .export-preview canvas{max-width:440px;box-shadow:0 8px 22px #1c160d45}
.receipt-export .export-preview textarea{height:calc(94dvh - 280px);min-height:160px;color:#282520;border:0;border-radius:0}
.receipt-actions{display:flex;align-items:center;justify-content:center;gap:35px;padding:20px 0 10px}
.receipt-round{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:80px;height:80px;border-radius:50%;border:2.5px solid #3d3931;outline:3px solid #fffdf4;box-shadow:0 4px 0 #302b2340;color:#292b26;transition:transform .18s}
.receipt-round:hover{transform:translateY(-2px)}.receipt-round:active{transform:translateY(1px)}
.receipt-round svg{width:31px;height:31px;stroke-width:1.8}

<script>

'use strict';
const paths={plus:'M12 5v14M5 12h14',export:'M12 15V3m-4 4 4-4 4 4M5 13v7h14v-7',receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2V3ZM9 7h6M9 11h6M9 15h3',chevron:'m9 6 6 6-6 6',close:'m6 6 12 12M6 18 18 6',check:'m5 12 4 4L19 6',home:'m3 10 9-7 9 7M5 9v12h14V9M10 21v-7h4v7',food:'M5 3v7m3-7v7M3 3v7a3 3 0 0 0 6 0V3M6 13v8M17 3c-5 5-5 10 1 10V3m0 10v8',car:'m5 6-2 7v6h3v-3h12v3h3v-6l-2-7H5ZM4 12h16M7 13v1m10-1v1',coffee:'M4 7h12v10a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V7ZM16 8h2a3 3 0 0 1 0 6h-2M7 2v2m5-2v2',info:'M12 11v6m0-10v.1M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',lock:'M6 10h12v11H6V10Zm3 0V6a3 3 0 0 1 6 0v4',history:'M3 5v5h5M3 10a9 9 0 1 1 1 8m8-12v6l4 2',split:'M5 3v4a5 5 0 0 0 5 5h4a5 5 0 0 1 5 5v4M19 3v4a5 5 0 0 1-5 5h-4a5 5 0 0 0-5 5v4M3 19l2 2 2-2m10 0 2 2 2-2',arrow:'M5 12h14m-5-5 5 5-5 5'};

const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>(c/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const yuan=c=>'¥'+money(c), sum=a=>a.reduce((x,y)=>x+y,0), clone=x=>JSON.parse(JSON.stringify(x));

const config=window.BILL_SPLIT_CONFIG,bridge=window.BillSplitNative;
let sourceBills=[],loadingBills=false,loadSerial=0;
const defaults=()=>({version:1,id:null,title:'分摊算账',mode:'aa',bills:[],members:[{id:'me',name:'我',self:true,weight:1}],payments:[]});

try{
 const raw=localStorage.getItem(config.storageKey);
 if(raw){
  const saved=JSON.parse(raw);
  if(saved?.schemaVersion!==1||!Array.isArray(saved.groups)||saved.groups.some(g=>!g.id||!Array.isArray(g.bills)||!Array.isArray(g.members)||!g.members.some(m=>m.self)||!Array.isArray(g.payments)))throw Error('数据格式错误');
  book=saved;state=clone(book.groups.find(g=>g.id===book.currentId)||book.groups[0]||defaults());
 }else if(config.demo&&window.BILL_SPLIT_DEMO_SEED){
  state=clone(window.BILL_SPLIT_DEMO_SEED);state.id='demo-group';
  book={schemaVersion:1,currentId:state.id,groups:[clone(state)]};
 }
}catch{storageBlocked=true;storageMessage='本地数据暂时无法读取，请勿清理原数据。';}
let current='rain',tab='bills',modalKind='',paymentDraft=null,createDraft=null,exportMode='image',exportScope='all',lastFocus=null,toastTimer,undoSnapshot=null,exportCanvas=null;
if(!state.members.some(m=>m.id===current))current='all';

function renderStorageStatus(){
 const el=$('#storage-status');el.hidden=!storageMessage;el.textContent=storageMessage;
}
function persist(){
 try{
  if(storageBlocked)throw Error('原数据无法读取');
  if(state.id){
   const i=book.groups.findIndex(g=>g.id===state.id);
   if(i<0)book.groups.unshift(clone(state));else book.groups[i]=clone(state);
   book.currentId=state.id;
  }
  localStorage.setItem(config.storageKey,JSON.stringify(book));storageMessage='';renderStorageStatus();return true;
 }catch{storageMessage='未保存：本地存储不可用，请保持页面打开。';renderStorageStatus();return false;}
}
function allocation(bill){return allocateCents(bill.amount,state.members.map(m=>state.mode==='percent'?m.percentBps:state.mode==='aa'?1:Number(m.weight)));}
function allBills(){return [...state.bills,...(state.extras||[])];}
function memberBills(member){return allBills().filter(b=>!b.member||b.member===member);}
function share(member,bill){return bill.member?(bill.member===member?bill.amount:0):allocation(bill)[state.members.findIndex(m=>m.id===member)];}
function paid(member,billId){return sum(state.payments.filter(p=>p.member===member).map(p=>p.allocations[billId]||0));}
function due(member){return sum(memberBills(member).map(b=>share(member,b)));}
function received(member){return sum(memberBills(member).map(b=>paid(member,b.id)));}
function remaining(member,bill){return share(member,bill)-paid(member,bill.id);}
function total(){return sum(allBills().map(b=>b.amount));}
function others(){return state.members.filter(m=>!m.self);}

const modalHead=title=>`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-close aria-label="关闭">${icon('close')}</button></div>`;
function addPayment(member,allocations,message,label='按金额记收款'){
 checkpoint();state.payments.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),member,amount:sum(Object.values(allocations)),time:new Date().toISOString(),allocations,label});persist();render();notify(message||'已记下这笔收款',true);
}
function openPayment(){
 const member=state.members.find(m=>m.id===current),bills=memberBills(current).filter(b=>remaining(current,b)>0);
 if(!bills.length)return;
 paymentDraft={member:current,max:sum(bills.map(b=>remaining(current,b)))};
 showModal('payment',modalHead('输入收款金额')+`<p class="modal-sub">${esc(member.name)} · 还需收款 ${yuan(paymentDraft.max)}</p><label class="field"><span>这次收到了多少</span><div class="amount-field"><span>¥</span><input id="pay-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="本次收到的金额"></div></label><div class="error" role="alert" id="pay-error"></div><div class="modal-foot"><button class="button outline" id="pay-cancel">取消</button><button class="button primary" id="pay-save">记下这笔收款</button></div>`);
 $('#pay-cancel').onclick=closeModal;
 $('#pay-save').onclick=()=>{
  const value=cents($('#pay-amount').value),alloc={};let err='';
  if(!Number.isFinite(value)||value<=0)err='请输入大于 0 的金额，最多保留两位小数。';
  else if(value>paymentDraft.max)err='本次收款超过待付金额，请调整金额。';
  if(err){$('#pay-error').textContent=err;return;}
  let rest=value;for(const b of bills){const v=Math.min(rest,remaining(current,b));if(v>0)alloc[b.id]=v;rest-=v;}
  addPayment(paymentDraft.member,alloc,'已记收款 '+yuan(value));closeModal();
 };
 $('#pay-amount').focus();
}
function openPersonalBill(){
 const target=current,member=state.members.find(m=>m.id===target);
 showModal('personal',modalHead('给'+esc(member.name)+'新增分摊')+`<label class="field"><span>分摊什么</span><input id="extra-name" placeholder="例如：帮你买的车票" maxlength="40"></label><label class="field"><span>需要 ${esc(member.name)} 给我的金额</span><div class="amount-field"><span>¥</span><input id="extra-amount" inputmode="decimal" placeholder="0.00" aria-label="个人新增分摊金额"></div></label><div class="error" role="alert" id="extra-error"></div><div class="modal-foot"><button class="button outline" id="extra-cancel">取消</button><button class="button primary" id="extra-save">添加这条分摊</button></div>`);
 $('#extra-cancel').onclick=closeModal;
 $('#extra-save').onclick=()=>{const name=$('#extra-name').value.trim(),amount=cents($('#extra-amount').value);if(!name||!Number.isFinite(amount)||amount<=0){$('#extra-error').textContent='填写分摊名称和大于 0 的金额，最多两位小数。';return;}checkpoint();state.extras=state.extras||[];state.extras.push({id:'extra-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),member:target,name,amount,type:'receipt',category:'独立分摊',date:new Date().toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit'})});persist();closeModal();tab='bills';render();notify('已为'+member.name+'追加 '+yuan(amount),true);};
 $('#extra-name').focus();
}
function parsePercent(value){
 const s=String(value).trim();
 if(!/^\d+(?:\.\d{1,2})?$/.test(s))return NaN;
 const bps=Math.round(Number(s)*100);return bps>=0&&bps<=10000?bps:NaN;
}
function evenPercents(count){const base=Math.floor(10000/count),rest=10000-base*count;return Array.from({length:count},(_,i)=>base+(i<rest?1:0));}
function formatPercent(bps){return (bps/100).toFixed(2).replace(/\.?0+$/,'')+'%';}
function allocateCents(amount,weights){
 const total=sum(weights),raw=weights.map(w=>amount*w/total),out=raw.map(Math.floor);
 const order=raw.map((r,i)=>({i,f:r-out[i]})).sort((a,b)=>b.f-a.f||a.i-b.i);
 for(let rest=amount-sum(out),i=0;i<rest;i++)out[order[i%order.length].i]++;
 return out;
}

async function openCreate(){
 const serial=++loadSerial;loadingBills=true;
 showModal('loading',modalHead('读取本地账单')+'<div class="empty">正在读取所有账本最近 200 条支出…</div>');
 try{
  const result=await bridge.getLocalBills();
  if(serial!==loadSerial||modalKind!=='loading')return;
  sourceBills=result.items;
  if(!sourceBills.length){showModal('empty-bills',modalHead('选择账单')+'<div class="empty">所有账本暂无支出。</div>');return;}
  const p=evenPercents(3);
  createDraft={step:1,selected:new Set(),title:'新的分摊',mode:'aa',members:['我','成员 2','成员 3'].map((name,i)=>({name,self:i===0,percent:(p[i]/100).toFixed(2)}))};
  renderCreate();
 }catch(error){
  if(serial!==loadSerial)return;
  showModal('load-error',modalHead('读取本地账单')+'<div class="empty">'+esc(error.message)+'</div><div class="modal-foot"><button class="button primary" id="retry-bills">重新读取</button></div>');
  $('#retry-bills').onclick=openCreate;
 }finally{loadingBills=false;}
}
function openHistory(){
 showModal('history',modalHead('历史分摊')+(book.groups.length?'<div class="history-list">'+book.groups.map(g=>'<button class="history-item" data-history="'+esc(g.id)+'"><b>'+esc(g.title)+'</b><span>'+g.bills.length+' 笔 · '+g.members.length+' 人</span></button>').join('')+'</div>':'<div class="empty">还没有分摊记录</div>'));
 $('#modal').querySelectorAll('[data-history]').forEach(el=>el.onclick=()=>{
  state=clone(book.groups.find(g=>g.id===el.dataset.history));current='all';tab='bills';undoSnapshot=null;persist();closeModal();render();
 });
}
function renderCreate(){
 const d=createDraft,selected=sourceBills.filter(b=>d.selected.has(b.id)),amount=sum(selected.map(b=>b.amount));
 const steps=`<div class="step-indicator"><span class="${d.step===1?'on':''}">01 选账单</span><i></i><span class="${d.step===2?'on':''}">02 设分摊</span><i></i><span class="${d.step===3?'on':''}">03 确认</span></div>`;
 let content='';
 if(d.step===1)content='<p class="source-caption">所有账本 · 最近 '+sourceBills.length+' 条支出</p>'+sourceBills.map(b=>`<label class="bill-select"><input class="check" type="checkbox" data-select="${esc(b.id)}" ${d.selected.has(b.id)?'checked':''}><span class="grow"><b>${esc(b.name)}</b><small>${esc(b.bookName||"")} · ${esc(b.date)} · ${esc(b.category)}</small></span><b>${yuan(b.amount)}</b></label>`).join('')+`<div class="selected-total"><span id="selected-count">已选 ${selected.length} 笔</span><b id="selected-amount">${yuan(amount)}</b></div>`;
 if(d.step===2)content=`<label class="field"><span>分摊名称</span><input id="draft-title" value="${esc(d.title)}" maxlength="30"></label><div class="field"><span>分摊方式</span><div class="pill-tabs"><button data-mode="aa" class="${d.mode==='aa'?'active':''}">AA 平分</button><button data-mode="percent" class="${d.mode==='percent'?'active':''}">百分比分摊</button></div></div><div class="allocation-title"><span>参与人（包含我）</span><button class="button soft small" id="add-member">${icon('plus')} 加一个人</button></div>${d.mode==='percent'?'<div class="percent-toolbar"><span>每人的分摊比例</span><button class="button soft small" id="equal-percent">一键均分比例</button></div>':''}<div id="draft-members">${d.members.map((m,i)=>`<div class="member-input"><input data-name="${i}" value="${esc(m.name)}" aria-label="成员${i+1}姓名" maxlength="16">${d.mode==='percent'?`<div class="percent-input"><input data-percent="${i}" value="${esc(m.percent)}" inputmode="decimal" aria-label="成员${i+1}百分比"><span>%</span></div>`:''}${i>1?`<button class="icon-btn" data-remove="${i}" aria-label="删除成员${i+1}">${icon('close')}</button>`:''}</div>`).join('')}</div>${d.mode==='percent'?'<div id="percent-total" class="percent-total" aria-live="polite"></div>':''}`;
 if(d.step===3){
  const weights=d.members.map(m=>d.mode==='aa'?1:parsePercent(m.percent));
  const shares=d.members.map((_,i)=>sum(selected.map(b=>allocateCents(b.amount,weights)[i])));
  content=`<p class="modal-sub">${esc(d.title)} · ${selected.length} 笔 · ${d.mode==='aa'?'AA 平分':'百分比分摊 · 合计 100%'}</p><div class="draft-total">${yuan(amount)}</div>`+d.members.map((m,i)=>`<div class="allocation"><span class="avatar">${esc(m.name.slice(-1))}</span><div>${esc(m.name)}${d.mode==='percent'?'<small class="confirmed-percent">'+formatPercent(weights[i])+'</small>':''}</div><span>${yuan(shares[i])}</span></div>`).join('');
 }
 showModal('create',modalHead('新建分摊')+steps+content+`<div class="error" role="alert" id="draft-error"></div><div class="modal-foot"><button class="button outline" id="draft-back">${d.step===1?'取消':'上一步'}</button><button class="button primary" id="draft-next">${d.step===3?'创建分摊单':'下一步 '+icon('arrow')}</button></div>`);
 const capture=()=>{if(d.step!==2)return;d.title=$('#draft-title').value;$('#modal').querySelectorAll('[data-name]').forEach(i=>d.members[+i.dataset.name].name=i.value);$('#modal').querySelectorAll('[data-percent]').forEach(i=>d.members[+i.dataset.percent].percent=i.value);};
 const updatePercent=()=>{
  if(d.step!==2||d.mode!=='percent')return;
  capture();const vals=d.members.map(m=>parsePercent(m.percent)),valid=vals.every(Number.isFinite),total=valid?sum(vals):NaN,okay=valid&&total===10000;
  $('#percent-total').classList.toggle('valid',okay);$('#percent-total').classList.toggle('invalid',!okay);
  $('#percent-total').textContent=!valid?'请输入 0–100 的百分比，最多两位小数':okay?'合计 100%':`合计 ${formatPercent(total)} · ${total<10000?'还差':'超出'} ${formatPercent(Math.abs(10000-total))}`;
  $('#draft-next').disabled=!okay;$('#draft-error').textContent='';
 };
 if(d.step===1)$('#modal').querySelectorAll('[data-select]').forEach(i=>i.onchange=()=>{i.checked?d.selected.add(i.dataset.select):d.selected.delete(i.dataset.select);$('#selected-count').textContent='已选 '+d.selected.size+' 笔';$('#selected-amount').textContent=yuan(sum(sourceBills.filter(b=>d.selected.has(b.id)).map(b=>b.amount)));});
 if(d.step===2){
  $('#modal').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{capture();d.mode=b.dataset.mode;renderCreate();});
  $('#add-member').onclick=()=>{capture();if(d.members.length>=12){$('#draft-error').textContent='最多支持 12 位参与人。';return;}d.members.push({name:'成员 '+(d.members.length+1),percent:'0'});renderCreate();};
  $('#modal').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{capture();d.members.splice(+b.dataset.remove,1);renderCreate();});
  $('#equal-percent')?.addEventListener('click',()=>{capture();const vals=evenPercents(d.members.length);d.members.forEach((m,i)=>m.percent=(vals[i]/100).toFixed(2));renderCreate();});
  $('#modal').querySelectorAll('[data-percent]').forEach(i=>i.oninput=updatePercent);
  updatePercent();
 }
 $('#draft-back').onclick=()=>{capture();if(d.step===1)closeModal();else{d.step--;renderCreate();}};
 $('#draft-next').onclick=()=>{
  capture();let error='';
  if(d.step===1&&!d.selected.size)error='至少选择一笔消费。';
  if(d.step===2&&(!d.title.trim()||d.members.some(m=>!m.name.trim())))error='请填写名称和参与人的名字。';
  if(d.step===2&&d.mode==='percent'){const vals=d.members.map(m=>parsePercent(m.percent));if(!vals.every(Number.isFinite)||sum(vals)!==10000)error='百分比合计必须为 100%。';}
  if(error){$('#draft-error').textContent=error;return;}
  if(d.step<3){d.step++;renderCreate();return;}
  checkpoint();state={version:1,id:crypto.randomUUID?crypto.randomUUID():'group-'+Date.now()+'-'+Math.random().toString(36).slice(2),sourceScope:'all',createdAt:new Date().toISOString(),title:d.title.trim(),mode:d.mode,bills:clone(selected),members:d.members.map((m,i)=>({name:m.name.trim(),id:i?'m'+i:'me',self:i===0,weight:1,percentBps:parsePercent(m.percent)})),payments:[]};current='all';tab='bills';persist();closeModal();render();notify('已创建分摊单',true);
 };
}

function drawTicketFrame(context,x,y,width,height,edge=22){
 if(!receiptFrameImage.complete||!receiptFrameImage.naturalWidth)return;
 const sw=receiptFrameImage.naturalWidth,sh=receiptFrameImage.naturalHeight,s=28,d=Math.min(edge,width/5,height/4);
 const sx=[0,s,sw-s],sy=[0,s,sh-s],ssx=[s,sw-2*s,s],ssy=[s,sh-2*s,s];
 const dx=[x,x+d,x+width-d],dy=[y,y+d,y+height-d],dsx=[d,width-2*d,d],dsy=[d,height-2*d,d];
 for(let row=0;row<3;row++)for(let col=0;col<3;col++){if(row===1&&col===1)continue;context.drawImage(receiptFrameImage,sx[col],sy[row],ssx[col],ssy[row],dx[col],dy[row],dsx[col],dsy[row]);}
}
function commonDue(id){return sum(state.bills.map(b=>share(id,b)));}
function extraDue(id){return sum((state.extras||[]).filter(b=>b.member===id).map(b=>b.amount));}
function ruleLabel(){if(state.mode==='aa')return state.members.length+' 人 AA';const bps=state.mode==='percent'?state.members.map(m=>m.percentBps):allocateCents(10000,state.members.map(m=>Number(m.weight)));return '百分比分摊 · '+state.members.map((m,i)=>m.name+' '+formatPercent(bps[i])).join(' / ');}
function totalLedgerHTML(){
 const consumption=(b,independent=false)=>`<article class="ledger-consumption"><div class="ledger-consumption-head"><div><b>${esc(b.name)}</b><small>${esc(b.date)} · ${esc(b.category)}</small></div><strong>${yuan(b.amount)}</strong></div><div class="ledger-shares">${independent?`<span class="share-chip independent">${esc(state.members.find(m=>m.id===b.member)?.name)} <b>${yuan(b.amount)}</b></span>`:state.members.map(m=>`<span class="share-chip">${esc(m.name)} <b>${yuan(share(m.id,b))}</b></span>`).join('')}</div></article>`;
 const extras=state.extras||[];
 return `<section class="ledger-section"><div class="ledger-section-title"><h2>共同消费</h2><span>${state.bills.length} 笔 · ${yuan(sum(state.bills.map(b=>b.amount)))}</span></div><div class="ledger-consumptions">${state.bills.map(b=>consumption(b)).join('')}</div></section>${extras.length?`<section class="ledger-section"><div class="ledger-section-title"><h2>个人追加</h2><span>${extras.length} 笔 · ${yuan(sum(extras.map(b=>b.amount)))}</span></div><div class="ledger-consumptions">${extras.map(b=>consumption(b,true)).join('')}</div></section>`:''}`;
}

 const all=scope==='all',member=state.members.find(m=>m.id===scope);
 const pendingTotal=sum(others().map(m=>due(m.id)-received(m.id)));
 const lines=['分摊算账｜'+(exportSettings?.title||state.title),all?'总账单':member.name+'的分摊账单',''];
 if(all){
  lines.push('待收总额：'+yuan(pendingTotal),'账单总额：'+yuan(total()),'已收金额：'+yuan(sum(others().map(m=>received(m.id)))),'我的分摊：'+yuan(due(state.members.find(m=>m.self).id)),'',`分摊方式：${ruleLabel()}`,`参与人：${state.members.map(m=>m.name+(m.self&&m.name!=='我'?'（我）':'')).join('、')}`,'','【每人分摊】');
  for(const m of state.members){lines.push(m.name+(m.self&&m.name!=='我'?'（我）':''),`  共同 ${yuan(commonDue(m.id))} + 追加 ${yuan(extraDue(m.id))} = 应付 ${yuan(due(m.id))}`,m.self?'  我的份额':`  已付 ${yuan(received(m.id))}｜待付 ${yuan(due(m.id)-received(m.id))}`);}
  lines.push('',`【共同消费｜${state.bills.length} 笔】`);
  for(const b of state.bills)lines.push(`${b.name}  ${yuan(b.amount)}`,`  ${b.bookName?b.bookName+" · ":""}${b.date} · ${b.category}`,`  ${state.members.map(m=>m.name+' '+yuan(share(m.id,b))).join('｜')}`);
  lines.push('共同消费合计：'+yuan(sum(state.bills.map(b=>b.amount))));
  if(state.extras?.length){lines.push('',`【个人追加｜${state.extras.length} 笔】`);for(const b of state.extras)lines.push(`${b.name}  ${yuan(b.amount)}`,`  ${b.date}｜仅 ${state.members.find(m=>m.id===b.member).name} 分摊`);lines.push('个人追加合计：'+yuan(sum(state.extras.map(b=>b.amount))));}
  lines.push('','合计：'+yuan(total()));
 }else{
  lines.push(member.self?'我的分摊：'+yuan(due(scope)):'待付金额：'+yuan(due(scope)-received(scope)),'应付合计：'+yuan(due(scope)));
  if(!member.self)lines.push('已经付款：'+yuan(received(scope)));
  lines.push(`共同 ${yuan(commonDue(scope))} + 追加 ${yuan(extraDue(scope))}`,`分摊方式：${ruleLabel()}`,'');
  const bills=memberBills(scope),pending=member.self?bills:bills.filter(b=>remaining(scope,b)>0),settled=member.self?[]:bills.filter(b=>remaining(scope,b)<=0);
  lines.push(member.self?'【分摊明细】':'【未结清】');
  for(const b of pending)lines.push(`${member.self?'':'☐ '}${b.name}${b.member?'（独立追加）':''}  ${yuan(share(scope,b))}`,`  ${b.date} · ${b.member?'个人追加':'原账单 '+yuan(b.amount)}`);
  if(settled.length){lines.push('','【已结清】');for(const b of settled)lines.push(`☑ ${b.name}${b.member?'（独立追加）':''}  ${yuan(share(scope,b))}`);}
  if(!member.self)lines.push('','还需付款：'+yuan(due(scope)-received(scope)));
 }
 if(exportSettings?.note)lines.push('','备注：'+exportSettings.note);if(exportSettings?.showTime!==false)lines.push('','导出于 '+new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）');
 return lines.join('\n');
}
let exportSettings=null;
function buildCanvas(scope){
 const all=scope==='all',member=state.members.find(m=>m.id===scope),settings=exportSettings||{title:state.title,note:'',showTime:true};
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=100;
 const c=canvas.getContext('2d'),ops=[],left=94,right=986,width=892,black='#242220',muted='#88817a',red='#ff6679';
 const font=(size,weight=500)=>`${weight} ${size}px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif`;
 const measure=(s,size,weight=500)=>{c.font=font(size,weight);return c.measureText(String(s)).width;};
 const text=(s,x,y,size=29,color=black,weight=500,align='left',maxWidth=null)=>{
  let real=size;if(maxWidth)while(real>18&&measure(s,real,weight)>maxWidth)real--;
  ops.push(()=>{c.font=font(real,weight);c.textAlign=align;c.textBaseline='top';c.fillStyle=color;c.fillText(String(s),x,y);});
 };
 const wrap=(s,maxWidth,size=28,weight=500)=>{const rows=[];let line='';for(const ch of String(s)){if(ch==='\n'){rows.push(line);line='';continue;}if(line&&measure(line+ch,size,weight)>maxWidth){rows.push(line);line=ch;}else line+=ch;}if(line||!rows.length)rows.push(line);return rows;};
 const paragraph=(s,x,y,maxWidth,size=28,color=black,weight=500,lineHeight=size*1.45,align='left')=>{const rows=wrap(s,maxWidth,size,weight);rows.forEach((row,i)=>text(row,x,y+i*lineHeight,size,color,weight,align));return rows.length*lineHeight;};
 const line=(y,dash=true)=>ops.push(()=>{c.beginPath();c.setLineDash(dash?[13,9]:[]);c.strokeStyle=black;c.lineWidth=dash?3:1.5;c.moveTo(left,y);c.lineTo(right,y);c.stroke();c.setLineDash([]);});
 const strike=(x,y,w)=>ops.push(()=>{c.beginPath();c.strokeStyle='#b7afa4';c.lineWidth=2;c.moveTo(x,y);c.lineTo(x+w,y);c.stroke();});
 let y=86;
 y+=paragraph(settings.title||state.title,540,y,860,49,black,650,66,'center')+12;
 text(all?'分摊总账单':member.self?'我的分摊单':member.name+'的分摊单',540,y,33,black,600,'center',850);
 y+=73;line(y);y+=29;
 text('参与人数：'+state.members.length+' 人',left,y,27);
 text('明细：'+(all?allBills().length:memberBills(scope).length)+' 笔',right,y,27,black,500,'right');
 y+=45;
 y+=paragraph('分摊方式：'+ruleLabel(),left,y,width,25,black,500,36)+20;
 line(y);y+=30;
 const heading=(title,detail='')=>{text(title,left,y,32,black,650);if(detail)text(detail,right,y+3,24,muted,500,'right',420);y+=54;};
 const finance=(label,amount,highlight=false)=>{
  text(label+'：',right-286,y,highlight?36:29,highlight?red:black,highlight?650:500,'right');
  text(yuan(amount),right,y-2,highlight?43:32,highlight?red:black,highlight?650:600,'right',270);y+=highlight?65:52;
 };
 const item=(b,personal=false,done=false)=>{
  const amount=personal?share(scope,b):b.amount,ink=done?'#a99e90':black;
  const nameRows=wrap(b.name,650,31,600);
  nameRows.forEach((name,i)=>{text(name,left,y+i*43,31,ink,600);if(done)strike(left,y+i*43+18,measure(name,31,600));});
  const amountText=yuan(amount);text(amountText,right,y,33,ink,600,'right',210);
  if(done)strike(right-measure(amountText,33,600),y+19,measure(amountText,33,600));
  y+=Math.max(44,nameRows.length*43)+4;
  const meta=personal?(b.member?'个人追加':`${b.bookName?b.bookName+" · ":""}${b.date} · ${b.category} · 原账单 ${yuan(b.amount)}`):b.member?`${b.date} · 仅 ${state.members.find(m=>m.id===b.member).name} 分摊`:`${b.bookName?b.bookName+" · ":""}${b.date} · ${b.category}`;
  y+=paragraph(meta,left,y,width,24,muted,400,34);
  if(!personal&&!b.member)y+=paragraph(state.members.map(m=>`${m.name} ${yuan(share(m.id,b))}`).join('    '),left,y+8,width,25,muted,400,36)+8;
  y+=23;
 };
 if(all){
  heading('每人分摊');
  text('成员',left,y,27);text('应付',700,y,27,black,500,'right');text('待付',right,y,27,black,500,'right');y+=45;line(y);y+=23;
  const members=[...others()].sort((a,b)=>(due(b.id)-received(b.id))-(due(a.id)-received(a.id))).concat(state.members.filter(m=>m.self));
  for(const m of members){
   const names=wrap(m.name,360,31,600);names.forEach((name,i)=>text(name,left,y+i*42,31,black,600));
   text(yuan(due(m.id)),700,y,32,black,500,'right',255);
   text(m.self?'—':yuan(due(m.id)-received(m.id)),right,y,m.self?30:36,m.self?muted:red,600,'right',255);
   y+=Math.max(45,names.length*42)+6;
   y+=paragraph(`共同 ${yuan(commonDue(m.id))} + 追加 ${yuan(extraDue(m.id))}${m.self?' · 我的份额':' · 已付 '+yuan(received(m.id))}`,left,y,width,24,muted,400,34)+25;
  }
  line(y);y+=31;heading('共同消费',state.bills.length+' 笔');
  for(const b of state.bills)item(b);
  if(state.extras?.length){line(y);y+=28;heading('个人追加',state.extras.length+' 笔');for(const b of state.extras)item(b);}
  line(y);y+=32;
  finance('账单合计',total());finance('已收金额',sum(others().map(m=>received(m.id))));finance('我的分摊',due(state.members.find(m=>m.self).id));finance('待收金额',sum(others().map(m=>due(m.id)-received(m.id))),true);
 }else{
  const bills=memberBills(scope),pending=member.self?bills:bills.filter(b=>remaining(scope,b)>0),settled=member.self?[]:bills.filter(b=>remaining(scope,b)<=0);
  if(pending.length){heading(member.self?'分摊明细':'未结清',pending.length+' 笔');for(const b of pending)item(b,true);}
  if(settled.length){line(y);y+=28;heading('已结清',settled.length+' 笔');for(const b of settled)item(b,true,true);}
  line(y);y+=31;finance('分摊合计',due(scope));
  if(!member.self){finance('已经付款',received(scope));finance('还需付款',due(scope)-received(scope),true);}
 }
 const underlineY=y-7;ops.push(()=>{c.beginPath();c.strokeStyle=red;c.lineWidth=2.5;c.moveTo(490,underlineY+4);c.quadraticCurveTo(770,underlineY-9,right,underlineY-2);c.stroke();});
 if(settings.note){y+=16;y+=paragraph(settings.note,left,y,width,25,muted,400,37);}
 y+=31;
 text('分摊算账',left,y,21,muted,500);
 if(settings.showTime){const stamp=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});text(stamp,right,y+1,21,muted,400,'right');}
 y+=49;
 const h=Math.ceil(y+50);canvas.height=h;
 c.fillStyle='#f3df9f';c.fillRect(0,0,1080,h);
 c.fillStyle='#fff';c.beginPath();c.roundRect(34,27,1012,h-58,7);c.fill();
 for(const draw of ops)draw();
 drawTicketFrame(c,34,27,1012,h-58,22);
 c.fillStyle='#f3df9f';c.strokeStyle=black;c.lineWidth=3;
 for(let x=55;x<1032;x+=45){c.beginPath();c.arc(x,h-30,13,Math.PI,Math.PI*2);c.fill();c.stroke();}
 return canvas;
}
function exportFileName(){return state.title+'-'+(exportScope==='all'?'总账单':state.members.find(m=>m.id===exportScope).name)+(exportMode==='text'?'.txt':'.png');}
async function exportBlob(){
 if(exportMode==='text')return new Blob([exportLines(exportScope)],{type:'text/plain;charset=utf-8'});
 await receiptFrameImage.decode();return new Promise((resolve,reject)=>buildCanvas(exportScope).toBlob(blob=>blob?resolve(blob):reject(Error('图片生成失败')),'image/png'));
}
function openExport(scope=current,preserve=false){
 exportScope=scope;if(!preserve){exportMode='image';exportSettings={title:state.title,note:'',showTime:true};}
 showModal('export',modalHead('导出账单')+`<div class="export-toolbar"><select id="export-scope" aria-label="导出的账单"><option value="all">总账单</option>${state.members.map(m=>`<option value="${m.id}">${esc(m.name)}的账单</option>`).join('')}</select><div class="pill-tabs"><button data-export-mode="image" class="${exportMode==='image'?'active':''}">图片版</button><button data-export-mode="text" class="${exportMode==='text'?'active':''}">文字版</button></div></div><div class="export-preview" id="export-preview"></div><div class="receipt-actions"><button class="receipt-round edit-round" id="export-edit">${icon('receipt')}<span>编辑</span></button><button class="receipt-round share-round" id="export-share">${icon('export')}<span>分享</span></button></div><div class="export-secondary"><button id="export-copy">复制文字</button><button id="export-download">${exportMode==='image'?'保存图片':'下载文字'}</button></div>`,true);
 $('#modal').classList.add('receipt-export');
 $('#export-scope').value=scope;$('#export-scope').onchange=e=>{exportScope=e.target.value;renderExportPreview();};
 $('#modal').querySelectorAll('[data-export-mode]').forEach(b=>b.onclick=()=>{exportMode=b.dataset.exportMode;renderExportPreview();});
 $('#export-edit').onclick=openExportEditor;
 $('#export-copy').onclick=async()=>{try{await navigator.clipboard.writeText(exportLines(exportScope));notify('已复制账单文字');}catch{exportMode='text';renderExportPreview();const t=$('#export-preview textarea');t.select();if(document.execCommand('copy'))notify('已复制账单文字');else notify('按 Ctrl+C 复制选中的文字');}};
 
$('#export-download').onclick=async()=>{
 const button=$('#export-download');button.disabled=true;
 try{
  if(exportMode==='image'&&bridge.platform()!=='browser'){
   if(!bridge.canShareImage()){notify('请长按预览图保存');return;}
   await bridge.shareImage(buildCanvas(exportScope).toDataURL('image/png'),3);notify('图片已保存');
  }else{download(await exportBlob(),exportFileName());notify('已发起文件下载');}
 }catch(error){if(error.code!==-1000002)notify(error.message);}finally{button.disabled=false;}
};
 $('#export-share').onclick=async()=>{
  const button=$('#export-share');button.disabled=true;
  try{
   
if(exportMode==='image'&&bridge.platform()!=='browser'){
 if(!bridge.canShareImage()){notify('请长按预览图保存或发送');return;}
 showShareTargets();return;
}
if(exportMode==='text'&&bridge.platform()!=='browser'){$('#export-copy').click();return;}
const blob=await exportBlob(),file=new File([blob],exportFileName(),{type:blob.type});
   if(navigator.canShare?.({files:[file]})&&navigator.share)await navigator.share({files:[file],title:exportSettings.title||state.title});
   else if(exportMode==='text'&&navigator.share)await navigator.share({title:exportSettings.title||state.title,text:exportLines(exportScope)});
   else{download(blob,exportFileName());notify('已发起下载，可选择文件发送给对方');}
  }catch(e){if(e.name!=='AbortError')notify('分享未完成，可以点击保存图片');}finally{button.disabled=false;}
 };
 renderExportPreview();
 if(!receiptFrameImage.complete)receiptFrameImage.addEventListener('load',()=>{if(modalKind==='export')renderExportPreview();},{once:true});
}
function openExportEditor(){
 const saved={...exportSettings};
 showModal('export-edit',modalHead('编辑导出内容')+`<label class="field"><span>账单标题</span><input id="receipt-title" maxlength="40" value="${esc(saved.title)}"></label><label class="field"><span>备注（可选）</span><textarea id="receipt-note" maxlength="100" rows="3" placeholder="例如：周末旅行的费用明细">${esc(saved.note)}</textarea></label><label class="receipt-setting"><input class="check" id="receipt-show-time" type="checkbox" ${saved.showTime?'checked':''}>显示导出时间</label><div class="modal-foot"><button class="button outline" id="receipt-edit-cancel">取消</button><button class="button primary" id="receipt-edit-save">完成</button></div>`);
 $('#receipt-edit-cancel').onclick=()=>openExport(exportScope,true);
 $('#receipt-edit-save').onclick=()=>{exportSettings={title:$('#receipt-title').value.trim()||state.title,note:$('#receipt-note').value.trim(),showTime:$('#receipt-show-time').checked};openExport(exportScope,true);};
}
function renderExportPreview(){
 $('#modal').querySelectorAll('[data-export-mode]').forEach(b=>b.classList.toggle('active',b.dataset.exportMode===exportMode));
 $('#export-download').textContent=exportMode==='image'?'保存图片':'下载文字';$('#export-preview').replaceChildren();
 if(exportMode==='image'){exportCanvas=buildCanvas(exportScope);const img=new Image();img.alt='账单图片预览';img.src=exportCanvas.toDataURL('image/png');$('#export-preview').appendChild(img);}
 else{const t=document.createElement('textarea');t.readOnly=true;t.setAttribute('aria-label','账单文字预览');t.value=exportLines(exportScope);$('#export-preview').appendChild(t);}
}

function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);}
$('#new-group').onclick=openCreate;$('#export-open').onclick=()=>openExport();

$('#history-open').onclick=openHistory;
$('#reset-demo').onclick=()=>{
 if(!config.demo)return;checkpoint();state=clone(window.BILL_SPLIT_DEMO_SEED);state.id='demo-group';
 book={schemaVersion:1,currentId:state.id,groups:[clone(state)]};current='rain';tab='bills';settledOpen=true;persist();render();notify('已恢复模拟数据',true);
};
bridge.subscribe(message=>{
 if(message.action==='backIntercept'&&modalKind)closeModal();
});
function showShareTargets(){
 $('#native-share-targets')?.remove();
 const el=document.createElement('div');el.id='native-share-targets';el.className='native-share-targets';
 el.innerHTML=['微信好友','朋友圈','QQ 好友','保存图片'].map((name,i)=>'<button class="button soft small" data-share-target="'+i+'">'+name+'</button>').join('');
 $('#export-share').closest('.receipt-actions').after(el);
 el.querySelectorAll('[data-share-target]').forEach(button=>button.onclick=async()=>{
  el.querySelectorAll('button').forEach(b=>b.disabled=true);$('#export-download').disabled=true;$('#export-share').disabled=true;
  try{
   await bridge.shareImage(buildCanvas(exportScope).toDataURL('image/png'),Number(button.dataset.shareTarget));
   notify(Number(button.dataset.shareTarget)===3?'图片已保存':'已分享');
  }catch(error){if(error.code!==-1000002)notify(error.message);}
  finally{el.remove();$('#export-download')?.removeAttribute('disabled');$('#export-share')?.removeAttribute('disabled');}
 });
}

$('#backdrop').onclick=e=>{if(e.target===$('#backdrop'))closeModal();};
document.addEventListener('keydown',e=>{if(!modalKind)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const items=[...$('#modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,[tabindex="0"]')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#modal'))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
render();
})();
</script>
